name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: unzip project
        run: unzip -q "HeartbeatMC-26.3 (1).zip"
      - name: apply fixed GuiMixin
        run: cp GuiMixin.java HeartbeatMC/src/client/java/net/heartbeat/mixin/client/modmenu/GuiMixin.java
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: build
        working-directory: HeartbeatMC
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: HeartbeatMC/build/libs/
